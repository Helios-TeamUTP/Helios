# Configuración Nixpacks para Railway
# Node 20 + pnpm via corepack (incluido con Node 20).
# Build desde el subdirectorio frontend/.
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@9.3.0 --activate",
  "cd frontend && pnpm install --frozen-lockfile=false",
]

[phases.build]
cmds = ["cd frontend && pnpm build"]

[start]
cmd = "cd frontend && pnpm start"
