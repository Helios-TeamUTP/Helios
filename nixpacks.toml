# Configuración Nixpacks para Railway
# Node 22 + pnpm via corepack. Vite 8 / Vitest 4 / React 19 requieren Node 22+
# (node:util.styleText export).
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@9.3.0 --activate",
  "cd frontend && pnpm install --frozen-lockfile=false",
]

[phases.build]
cmds = ["cd frontend && pnpm build"]

[start]
cmd = "cd frontend && pnpm start"
