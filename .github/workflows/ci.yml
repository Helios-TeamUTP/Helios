name: CI

# Pipeline de integracion continua: build, lint y tests del frontend.
# Se ejecuta en cada push a main y en cada PR.
# Tambien permite ejecucion manual desde la pestana Actions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  frontend:
    name: Build · Lint · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77bd831585c7d104707295b5999c5437 # v4.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783328186356514f # v4.0.3
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      - name: Type check + Build
        working-directory: frontend
        run: pnpm build

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Run tests
        working-directory: frontend
        run: pnpm vitest run
