name: SonarCloud Analysis

# Corre en cada push a sprint1/bootstrap, main, y en cada PR.
# Tambien permite ejecucion manual desde la pestana Actions.
on:
  push:
    branches:
      - main
      - sprint1/bootstrap
      - sprint2/**
  pull_request:
    branches:
      - main
      - sprint1/bootstrap
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Shallow clones should be disabled for better analysis
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77bd831585c7d104707295b5999c5437 # v4.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783328186356514f # v4.0.3
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      - name: Run tests with coverage
        working-directory: frontend
        run: pnpm vitest run --coverage
        # Si los tests fallan, no aborta SonarCloud
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
