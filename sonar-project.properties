# HELIOS — SonarCloud config
# https://sonarcloud.io/project/overview?id=Helios-TeamUTP_Helios
sonar.organization=helios-teamutp
sonar.projectKey=Helios-TeamUTP_Helios
sonar.projectName=HELIOS — Sistema de Citas Médicas

sonar.sources=frontend/src,scripts
sonar.exclusions=**/*.test.tsx,**/*.test.ts,frontend/src/test/**,frontend/dist/**,**/node_modules/**

# scripts/ son utilidades de operacion/demo (seed de datos, generadores de
# PPTX, Locust) que hablan directo con Supabase; no hay infraestructura de
# tests Python en el proyecto (sin pytest/coverage.py). Se mantienen en
# sonar.sources para que Sonar los revise por bugs/code smells, pero se
# excluyen del requisito de coverage — de lo contrario el Quality Gate
# bloquea cada vez que se toca un script, sin relacion con la calidad del
# producto (frontend + Supabase) que si tiene cobertura real (B-31/B-32).
sonar.coverage.exclusions=scripts/**

sonar.tests=frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Reportes de coverage (Vitest -> lcov)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
